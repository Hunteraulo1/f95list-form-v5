name: f95list-form-v5-dev

services:
  mariadb-dev:
    image: mariadb:12.3
    container_name: f95list-form-v5-mariadb
    restart: unless-stopped
    env_file: ../../.env

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci

    ports:
      - "3306:3306"

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: f95list_form_dev
      MARIADB_USER: f95list
      MARIADB_PASSWORD: password

    volumes:
      - mariadb_data:/var/lib/mysql

  # --- Zitadel local (authentification) : `bun run dev:auth`
  # Console : http://localhost:8080/ui/console — compte admin par défaut
  # zitadel-admin@zitadel.localhost / Password1! (dev uniquement).
  # Tout passe par `zitadel-proxy` sur le port 8080 : l'API et l'écran de connexion doivent partager
  # la même adresse (retour des fournisseurs d'identité comme Discord sur /idps/callback).
  zitadel-proxy:
    image: caddy:2-alpine
    container_name: f95list-form-v5-zitadel-proxy
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    depends_on:
      zitadel-login:
        condition: service_started

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.4
    container_name: f95list-form-v5-zitadel
    restart: unless-stopped
    user: "0"
    # Clé de chiffrement de dev (32 caractères) : ne jamais la reprendre en production.
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled

    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_TLS_ENABLED: false

      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:zitadel@zitadel-postgres:5432/zitadel?sslmode=disable

      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      # Jeton du compte de service dont l'écran de connexion se sert pour parler à l'API.
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:8080/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:8080/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:8080/ui/v2/login/logout?post_logout_redirect=

    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:rw

    depends_on:
      zitadel-postgres:
        condition: service_healthy

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.19.4
    container_name: f95list-form-v5-zitadel-login
    restart: unless-stopped
    user: "0"
    # Même réseau que `zitadel` : l'API est sur localhost:8080 des deux côtés, comme pour le navigateur.
    network_mode: service:zitadel

    environment:
      PORT: 3001
      ZITADEL_API_URL: http://localhost:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      # Signe le cookie de session de l'écran de connexion (dev uniquement).
      ZITADEL_SESSION_COOKIE_SECRET: dev-only-session-cookie-secret-32chars
      CUSTOM_REQUEST_HEADERS: Host:localhost:8080

    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:ro

    depends_on:
      zitadel:
        condition: service_healthy

  zitadel-postgres:
    image: postgres:17-alpine
    container_name: f95list-form-v5-zitadel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U zitadel"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s

    volumes:
      - zitadel_postgres_data:/var/lib/postgresql/data

volumes:
  mariadb_data:
  zitadel_postgres_data:
  zitadel_bootstrap:
